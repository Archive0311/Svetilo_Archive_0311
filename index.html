<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИСТЕМА 0311</title>
    <link rel="icon" href="https://raw.githubusercontent.com/Archive0311/Svetilo_Archive_0311/main/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: none;
        }

        body {
            background: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Эффект статичного шума */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            animation: noise 0.2s infinite;
            opacity: 0.4;
        }

        @keyframes noise {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-10px, -10px); }
        }

        /* Мерцание экрана */
        .flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.03);
            pointer-events: none;
            z-index: 2;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Полоса помех */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, #ff0000, transparent);
            box-shadow: 0 0 10px #ff0000;
            pointer-events: none;
            z-index: 3;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Контейнер для ASCII */
        .ascii-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: pre;
            font-size: 8px;
            line-height: 1;
            color: #ff0000;
            letter-spacing: 0.5px;
            text-align: center;
            z-index: 4;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* Свечение для 'x' */
        .x-char {
            text-shadow: 
                0 0 3px #ff0000,
                0 0 6px #ff3333,
                0 0 12px #ff6666;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        /* Случайные мерцающие символы */
        .blink {
            animation: blink 0.3s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* Скрытый текст в углу */
        .hidden-text {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 9px;
            color: #330000;
            opacity: 0.3;
            z-index: 5;
        }

        /* Всплывающие сообщения */
        .message {
            position: fixed;
            font-size: 12px;
            color: #ff0000;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
            animation: float 5s linear;
            text-shadow: 0 0 5px #ff0000;
        }

        @keyframes float {
            0% { top: 100%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 0%; opacity: 0; }
        }

        /* Мигающий курсор */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #ff0000;
            margin-left: 2px;
            animation: cursor-blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Статус бар */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #ff0000;
            padding: 5px 10px;
            font-size: 10px;
            z-index: 7;
            display: flex;
            justify-content: space-between;
        }

        /* Предупреждение */
        .warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #ff0000;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            animation: warning 10s infinite;
            text-shadow: 0 0 10px #ff0000;
        }

        @keyframes warning {
            0%, 95% { opacity: 0; }
            96%, 100% { opacity: 1; }
        }
    </style>
</head>

                const charSpan = document.createElement('span');
                charSpan.textContent = char;
                
                if (char === 'x') {
