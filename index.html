<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0311</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    cursor: none;
}

body {
    background: #000;
    color: #ff0000;
    font-family: "Courier New", monospace;
    overflow: hidden;
    height: 100vh;
}

/* ===== МЯГКИЙ ШУМ ===== */
.noise {
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
    animation: noiseMove 1.5s steps(2) infinite;
    opacity: 0.25;
    pointer-events: none;
    z-index: 1;
}

@keyframes noiseMove {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(-2px,-2px); }
}

/* ===== ДЫХАНИЕ ЭКРАНА ===== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 70%);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 2;
}

@keyframes breathe {
    0%,100% { opacity: 0.2; }
    50% { opacity: 0.45; }
}

/* ===== ASCII ===== */
.ascii-container {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: pre;
    font-size: clamp(4px, 0.45vw, 9px);
    line-height: 1;
    text-align: center;
    z-index: 3;
    transition: filter 2s ease, transform 2s ease;
}

.x {
    text-shadow:
        0 0 3px #ff0000,
        0 0 10px #ff3333;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { opacity: 0.75; }
    to { opacity: 1; }
}

/* ===== МЕРЦАНИЕ ===== */
.blink {
    animation: blink 1.8s infinite;
}
@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
}

/* ===== РЕЗКИЙ СБОЙ ===== */
.glitch {
    animation: glitch 0.15s steps(2) infinite;
    filter: contrast(2) brightness(1.4);
}

@keyframes glitch {
    0% { transform: translate(0,0); }
    25% { transform: translate(-6px,2px); }
    50% { transform: translate(6px,-2px); }
    75% { transform: translate(-4px,4px); }
    100% { transform: translate(0,0); }
}

/* ===== ВСПЫШКА ===== */
.flash {
    position: fixed;
    inset: 0;
    background: rgba(255,0,0,0.15);
    opacity: 0;
    pointer-events: none;
    z-index: 9;
}

/* ===== ТЕКСТ В УГЛУ ===== */
.label {
    position: fixed;
    bottom: 8px;
    left: 8px;
    font-size: 10px;
    opacity: 0.35;
    z-index: 4;
}
</style>
</head>
