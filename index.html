<title>0311</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    background: #000;
    color: #ff0000;
    font-family: "Courier New", monospace;
    overflow: hidden;
    cursor: none;
}

/* Шум */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,0,0,0.03) 0px,
            rgba(255,0,0,0.03) 1px,
            transparent 2px,
            transparent 4px
        );
    animation: noise 0.15s infinite;
    pointer-events: none;
}

@keyframes noise {
    0% { transform: translate(0,0); }
    100% { transform: translate(-2px,2px); }
}

/* ASCII */
#ascii {
    position: absolute;
    inset: 0;
    white-space: pre;
    font-size: clamp(4px, 0.45vw, 10px);
    line-height: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* Свечение x */
.x {
    text-shadow:
        0 0 4px #ff0000,
        0 0 10px #ff0000;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { opacity: 0.6; }
    to   { opacity: 1; }
}

/* Надпись */
#label {
    position: fixed;
    bottom: 10px;
    left: 10px;
    font-size: 10px;
    opacity: 0.4;
    animation: blink 2s infinite;
}

@keyframes blink {
    0%,100% { opacity: 0.4; }
    50% { opacity: 0.1; }
}
</style>
</head>
